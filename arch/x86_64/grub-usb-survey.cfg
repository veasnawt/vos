# USB input bring-up, Increment 1: the same kernel as the default image, with a visible menu whose entries run the
# read-only USB survey. The survey only reads PCI configuration space and xHCI registers and writes nothing; it does not
# start any USB driver. The third entry is the unchanged default boot.
set timeout=15
set default=0

menuentry "VOS USB survey (read-only; halts when done so the screen stays readable)" {
    multiboot2 /boot/vos.bin vos.usb-survey=hold
    boot
}

menuentry "VOS USB survey (read-only; then continues to boot)" {
    multiboot2 /boot/vos.bin vos.usb-survey=1
    module2 /boot/hello.elf hello
    boot
}

menuentry "VOS (x86_64), unchanged default boot" {
    multiboot2 /boot/vos.bin
    module2 /boot/hello.elf hello
    boot
}
