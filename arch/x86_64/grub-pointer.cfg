set timeout=0
set default=0
menuentry "VOS native pointer demo (interactive)" {
    set gfxpayload=1024x768x32,800x600x32,640x480x32,auto
    multiboot2 /boot/vos.bin vos.apps=1 vos.desktop=1 vos.gui=1 vos.pointer=1
    module2 /boot/vsh.elf vsh
    module2 /boot/hello.elf hello
    module2 /boot/rixie.elf rixie
    module2 /boot/gui-demo.elf gui-demo
    module2 /boot/pointer-demo.elf pointer-demo
    boot
}
