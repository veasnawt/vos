set timeout=0
set default=0
menuentry "VOS ABI v4 execution verification" {
    multiboot2 /boot/vos.bin vos.exec=1
    module2 /boot/vsh.elf vsh
    module2 /boot/hello.elf hello
    module2 /boot/rixie.elf rixie
    module2 /boot/exec-probe.elf exec-probe
    module2 /boot/exec-negative.elf exec-negative
    module2 /boot/exec-fault.elf exec-fault
    module2 /boot/exec-spin.elf exec-spin
    module2 /boot/exec-recursive.elf exec-recursive
    module2 /boot/exec-contender.elf exec-contender
    module2 /boot/exec-legacy0.elf exec-legacy0
    module2 /boot/exec-legacy1.elf exec-legacy1
    module2 /boot/exec-legacy2.elf exec-legacy2
    module2 /boot/exec-legacy3.elf exec-legacy3
    boot
}
