# N2.5 stress image (VOS_TEST_CASE=stress): the separately built programs that
# selftest_stress.c (trusted kernel code) runs in mixed concurrent workloads.
# The kernel finds them by module name and judges every scenario by its own
# records and its scheduler, process and channel audits.
set timeout=0
set default=0

menuentry "VOS (x86_64, N2.5 stress)" {
    multiboot2 /boot/vos.bin
    module2 /boot/hello.elf hello
    module2 /boot/suite/spin.elf spin
    module2 /boot/suite/irqregs.elf irqregs
    module2 /boot/suite/memtag1.elf memtag1
    module2 /boot/suite/memtag2.elf memtag2
    module2 /boot/suite/null.elf null
    module2 /boot/suite/ipc_ping.elf ipc_ping
    module2 /boot/suite/ipc_echo.elf ipc_echo
    module2 /boot/suite/ipc_chat.elf ipc_chat
    module2 /boot/suite/ipc_wait.elf ipc_wait
}
