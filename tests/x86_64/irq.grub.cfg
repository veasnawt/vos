# N2.1 timer-interrupt suite (VOS_TEST_CASE=irq): separately built programs run
# with IF = 1 while the PIT interrupts them; same runner and rules as the N1.9
# isolation suite (selftest_suite.c). expect=budget means: never exits, killed
# by the kernel's test tick budget after exactly ticks= timer ticks in ring 3.
# This file is the trusted test configuration: verdicts never come from program output.
set timeout=0
set default=0

menuentry "VOS (x86_64, timer interrupts)" {
    multiboot2 /boot/vos.bin
    module2 /boot/hello.elf hello
    module2 /boot/suite/spin.elf t-spin expect=budget ticks=50 ok=0
    module2 /boot/suite/irqregs.elf t-irqregs expect=budget ticks=50 ok=0
    module2 /boot/suite/iflock.elf t-iflock expect=budget ticks=20 ok=0
    module2 /boot/suite/kernelif.elf t-kernelif expect=exit status=0 ok=1
    module2 /boot/suite/sti.elf t-sti expect=fault vec=13 err=0x0 ok=0
    module2 /boot/suite/regs.elf t-regs expect=exit status=0 ok=0
    module2 /boot/suite/syscalls.elf t-syscalls expect=exit status=0 ok=2 enosys=2 einval=1 efault=6
    module2 /boot/suite/null.elf t-null expect=fault vec=14 err=0x4 cr2=0x0 ok=0
    module2 /boot/suite/spin.elf t-spin2 expect=budget ticks=5 ok=0
}
