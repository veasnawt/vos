# Gate A has no full-group entry point. Canary is not an SC result.
set timeout=0
set default=0
menuentry "VOS (x86_64, N3.6 Gate A canary)" {
    multiboot2 /boot/vos.bin
    module2 /boot/hello.elf hello
    module2 /boot/storage-stress.img storage-stress.img
    module2 /boot/storage-canary.elf storage-canary
}
