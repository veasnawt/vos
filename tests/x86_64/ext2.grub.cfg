# N3.3 ext2 image (VOS_TEST_CASE=ext2): every fixture image and its manifest,
# delivered by GRUB; QEMU also attaches build/ext2/ext2-1k.img through virtio-blk.
set timeout=0
set default=0

menuentry "VOS (x86_64, ext2 reader)" {
    multiboot2 /boot/vos.bin
    module2 /boot/hello.elf hello
    module2 /boot/ext2/ext2-1k.img ext2-1k.img
    module2 /boot/ext2/ext2-1k.manifest ext2-1k.manifest
    module2 /boot/ext2/ext2-2k.img ext2-2k.img
    module2 /boot/ext2/ext2-2k.manifest ext2-2k.manifest
    module2 /boot/ext2/ext2-4k.img ext2-4k.img
    module2 /boot/ext2/ext2-4k.manifest ext2-4k.manifest
    module2 /boot/ext2/ext2-htree.img ext2-htree.img
    module2 /boot/ext2/ext2-htree.manifest ext2-htree.manifest
    module2 /boot/ext2/ext2-nofeat.img ext2-nofeat.img
    module2 /boot/ext2/ext2-nofeat.manifest ext2-nofeat.manifest
    module2 /boot/ext2/ext2-empty.img ext2-empty.img
    module2 /boot/ext2/ext2-empty.manifest ext2-empty.manifest
    module2 /boot/suite/memtag1.elf m-memtag1
    module2 /boot/suite/memtag2.elf m-memtag2
    module2 /boot/suite/irqregs.elf m-irqregs
}
