# Test image for VOS_TEST_CASE=app-reject: GRUB delivers the kernel's own ELF
# (linked at 0x100000 and the higher half; debug sections stripped, see
# app-reject.mk) as "hello"; the loader must refuse it.
set timeout=0
set default=0

menuentry "VOS (x86_64, invalid application)" {
    multiboot2 /boot/vos.bin
    module2 /boot/kernel-as-app.elf hello
    boot
}
