# N2.3 multi-process image (VOS_TEST_CASE=mp): separately built programs that
# the kernel runs at the same time (selftest_mp.c), several copies of some.
# The kernel finds each program by its module name; every verdict comes from
# the kernel's own records, never from program output.
set timeout=0
set default=0

menuentry "VOS (x86_64, multiple processes)" {
    multiboot2 /boot/vos.bin
    module2 /boot/hello.elf hello
    module2 /boot/suite/spin.elf m-spin
    module2 /boot/suite/irqregs.elf m-irqregs
    module2 /boot/suite/memtag1.elf m-memtag1
    module2 /boot/suite/memtag2.elf m-memtag2
    module2 /boot/suite/null.elf m-null
    module2 /boot/suite/syscalls.elf m-syscalls
}
