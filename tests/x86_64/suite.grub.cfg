# N1.9 isolation suite (VOS_TEST_CASE=suite). Every module named t-* is one case;
# the rest of its command line is the expected outcome (see selftest_suite.c).
# This file is the trusted test configuration: verdicts never come from program output.
set timeout=0
set default=0

menuentry "VOS (x86_64, isolation suite)" {
    multiboot2 /boot/vos.bin
    module2 /boot/hello.elf hello
    module2 /boot/suite/kwrite.elf t-kwrite expect=fault vec=14 err=0x7 cr2=0xffffffff80100000 ok=0
    module2 /boot/suite/kread.elf t-kread expect=fault vec=14 err=0x5 cr2=0xffffffff80100000 ok=0
    module2 /boot/suite/codewrite.elf t-codewrite expect=fault vec=14 err=0x7 cr2=0x400000 ok=0
    module2 /boot/suite/execstack.elf t-execstack expect=fault vec=14 err=0x15 cr2=stack ripcr2 ok=0
    module2 /boot/suite/execdata.elf t-execdata expect=fault vec=14 err=0x15 cr2=image ripcr2 ok=0
    module2 /boot/suite/execrodata.elf t-execrodata expect=fault vec=14 err=0x15 cr2=image ripcr2 ok=0
    module2 /boot/suite/guard.elf t-guard expect=fault vec=14 err=0x6 cr2=guard ok=0
    module2 /boot/suite/null.elf t-null expect=fault vec=14 err=0x4 cr2=0x0 ok=0
    module2 /boot/suite/vga.elf t-vga expect=fault vec=14 err=0x6 cr2=0xb8000 ok=0
    module2 /boot/suite/cli.elf t-cli expect=fault vec=13 err=0x0 ok=0
    module2 /boot/suite/hlt.elf t-hlt expect=fault vec=13 err=0x0 ok=0
    module2 /boot/suite/movcr3.elf t-movcr3 expect=fault vec=13 err=0x0 ok=0
    module2 /boot/suite/wrmsr.elf t-wrmsr expect=fault vec=13 err=0x0 ok=0
    module2 /boot/suite/outb.elf t-outb expect=fault vec=13 err=0x0 ok=0
    module2 /boot/suite/inb.elf t-inb expect=fault vec=13 err=0x0 ok=0
    module2 /boot/suite/int14.elf t-int14 expect=fault vec=13 err=0x72 ok=0
    module2 /boot/suite/int81.elf t-int81 expect=fault vec=13 err=0x40a ok=0
    module2 /boot/suite/int3.elf t-int3 expect=fault vec=13 err=0x1a ok=0
    module2 /boot/suite/ud2.elf t-ud2 expect=fault vec=6 err=0x0 ok=0
    module2 /boot/suite/x87.elf t-x87 expect=fault vec=7 err=0x0 ok=0
    module2 /boot/suite/sse.elf t-sse expect=fault vec=6 err=0x0 ok=0
    module2 /boot/suite/sgdt.elf t-sgdt expect=umip ok=0
    module2 /boot/suite/sidt.elf t-sidt expect=umip ok=0
    module2 /boot/suite/smsw.elf t-smsw expect=umip ok=0
    module2 /boot/suite/str.elf t-str expect=umip ok=0
    module2 /boot/suite/syscalls.elf t-syscalls expect=exit status=0 ok=2 enosys=2 einval=1 efault=6
    module2 /boot/suite/df.elf t-df expect=exit status=0 ok=1
    module2 /boot/suite/align.elf t-align expect=exit status=0 ok=0
    module2 /boot/suite/regs.elf t-regs expect=exit status=0 ok=0
    module2 /boot/suite/dirty.elf t-dirty expect=exit status=0 nohello
    module2 /boot/suite/clean.elf t-clean expect=exit status=0 ok=0
    module2 /boot/suite/forge.elf t-forge expect=exit status=0 ok=1
    module2 /boot/suite/acflag.elf t-acflag expect=smapac ok=2
    module2 /boot/suite/bad-magic.elf t-bad-magic expect=reject elf=magic
    module2 /boot/suite/bad-dyn.elf t-bad-dyn expect=reject elf=dyn
    module2 /boot/suite/bad-wx.elf t-bad-wx expect=reject elf=wx
    module2 /boot/suite/bad-entry.elf t-bad-entry expect=reject elf=entry
    module2 /boot/suite/bad-abi.elf t-bad-abi expect=reject elf=abi
    module2 /boot/suite/bad-interp.elf t-bad-interp expect=reject elf=ptype
    module2 /boot/suite/bad-trunc.elf t-bad-trunc expect=reject elf=phbounds
    module2 /boot/suite/bad-overlap.elf t-bad-overlap expect=reject elf=overlap
    boot
}
