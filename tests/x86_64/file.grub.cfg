# N3.5: all native and ring-3 file tests; the sole consumed disk fixture.
# The full ext2 reader matrix runs separately via ext2.grub.cfg.
set timeout=0
set default=0

menuentry "VOS (x86_64, file API)" {
    multiboot2 /boot/vos.bin
    module2 /boot/hello.elf hello
    module2 /boot/ext2/ext2-1k.img ext2-1k.img
    module2 /boot/filetests/probe.elf file-probe
    module2 /boot/filetests/reader.elf file-reader
    module2 /boot/filetests/reader_y.elf file-reader-y
    module2 /boot/filetests/error.elf file-error
    module2 /boot/filetests/gate0.elf file-gate0
    module2 /boot/filetests/gate1.elf file-gate1
    module2 /boot/filetests/boundary.elf file-boundary
    module2 /boot/filetests/nogrant.elf file-nogrant
    module2 /boot/filetests/cookie.elf file-cookie
    module2 /boot/filetests/regs.elf file-regs
    module2 /boot/filetests/adversary.elf file-adversary
}
