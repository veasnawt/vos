# Test image for VOS_TEST_CASE=modules: two GRUB module2 modules plus kernel arguments.
set timeout=0
set default=0

menuentry "VOS (x86_64, module test)" {
    multiboot2 /boot/vos.bin vos.test=1
    module2 /boot/n12-module.bin mod.arg=first
    module2 /boot/n12-module.bin mod.arg=second
    boot
}
