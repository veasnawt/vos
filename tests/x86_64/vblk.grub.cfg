# N3.1 virtio-blk image (VOS_TEST_CASE=vblk). QEMU attaches build/vblk/disk.img
# through virtio-blk-pci (arch.mk); GRUB delivers the same file as the module
# vblk-fixture. The suite programs run while a kernel thread reads the disk.
set timeout=0
set default=0

menuentry "VOS (x86_64, virtio-blk)" {
    multiboot2 /boot/vos.bin
    module2 /boot/hello.elf hello
    module2 /boot/vblk-fixture.img vblk-fixture
    module2 /boot/suite/memtag1.elf m-memtag1
    module2 /boot/suite/memtag2.elf m-memtag2
    module2 /boot/suite/irqregs.elf m-irqregs
}
