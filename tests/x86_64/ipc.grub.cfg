# N2.4 IPC image (VOS_TEST_CASE=ipc). This file is the trusted test configuration:
# it selects the separately built programs, wires one channel between the two
# processes of each scenario (handle 1 in each), sets the rights, the start
# order and kills, and states the expected outcome. Every "s-" module is one
# scenario (its file is only a carrier); the kernel judges it by its own
# records (selftest_ipc.c), never by program output.
set timeout=0
set default=0

menuentry "VOS (x86_64, IPC channels)" {
    multiboot2 /boot/vos.bin
    module2 /boot/hello.elf hello
    module2 /boot/suite/ipc_ping.elf ipc_ping
    module2 /boot/suite/ipc_echo.elf ipc_echo
    module2 /boot/suite/ipc_flood.elf ipc_flood
    module2 /boot/suite/ipc_drain.elf ipc_drain
    module2 /boot/suite/ipc_wait.elf ipc_wait
    module2 /boot/suite/ipc_rights.elf ipc_rights
    module2 /boot/suite/ipc_regs.elf ipc_regs
    module2 /boot/suite/ipc_forge.elf ipc_forge
    module2 /boot/suite/ipc_abi1.elf ipc_abi1
    module2 /boot/suite/ipc_sendfault.elf ipc_sendfault
    module2 /boot/suite/v1calls.elf v1calls
    module2 /boot/suite/spin.elf spin
    module2 /boot/suite/null.elf null
    module2 /boot/scenario.txt s-pingpong a=ipc_ping b=ipc_echo order=b-blocked ea=exit:0 eb=exit:10 ia=10 ib=10 repeat=3
    module2 /boot/scenario.txt s-regs a=ipc_regs b=ipc_echo order=b-blocked ea=exit:0 eb=exit:1 ia=1 ib=1
    module2 /boot/scenario.txt s-drain a=ipc_flood b=ipc_drain order=a-then-b ea=exit:16 eb=exit:16 ia=0 ib=16
    module2 /boot/scenario.txt s-busy a=ipc_ping b=ipc_echo order=ab ea=exit:0 eb=exit:10 ia=10 ib=10
    module2 /boot/scenario.txt s-killwait a=spin b=ipc_wait order=b-blocked kill=b kblocked ea=killed eb=killed ib=0
    module2 /boot/scenario.txt s-peerdeath a=ipc_ping b=null order=b-then-a ea=exit:100 eb=fault:14
    module2 /boot/scenario.txt s-faultsender a=ipc_sendfault b=ipc_drain order=a-then-b ea=fault:14 eb=exit:3 ia=0 ib=3
    module2 /boot/scenario.txt s-rights a=ipc_rights b=spin ra=recv rb=send ea=exit:0 eb=killed
    module2 /boot/scenario.txt s-yield a=ipc_abi1 b=none nochan ea=exit:0
    module2 /boot/scenario.txt s-v0compat a=v1calls b=none nochan ea=exit:0
    module2 /boot/scenario.txt s-hello a=hello b=none nochan ea=exit:0
    module2 /boot/scenario.txt s-forge a=ipc_forge b=none nochan ea=exit:0
}
