serial --unit=0 --speed=115200
terminal_output console serial
echo "USB2B CHOICE: r then Enter for resource tests; Enter for normal GUI"
read selection
set extra=""
if [ "$selection" = "r" ]; then
 set extra="vos.usb-resources=1 vos.usb_probe=1"
fi
set gfxpayload=1024x768x32,auto
multiboot2 /boot/vos.bin vos.apps=1 vos.desktop=1 vos.gui=1 $extra
module2 /boot/vsh.elf vsh
module2 /boot/hello.elf hello
module2 /boot/rixie.elf rixie
module2 /boot/gui-demo.elf gui-demo
boot
