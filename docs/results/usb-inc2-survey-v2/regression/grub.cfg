serial --unit=0 --speed=115200
terminal_input console serial
terminal_output console serial
set timeout=-1
set default=0
echo VOS-REGRESSION-MENU
menuentry "n normal" {
    multiboot2 /boot/vos.bin 
    module2 /boot/hello.elf hello
    boot
}
menuentry "q qualify" {
    multiboot2 /boot/vos.bin vos.usb2-qualify=1
    module2 /boot/hello.elf hello
    boot
}
menuentry "d dma" {
    multiboot2 /boot/vos.bin vos.usb2-residue=1 vos.usb2c2-dma=1
    module2 /boot/hello.elf hello
    boot
}
menuentry "c conflict" {
    multiboot2 /boot/vos.bin vos.usb-survey=1 vos.usb_probe=1
    module2 /boot/hello.elf hello
    boot
}
