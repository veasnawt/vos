serial --unit=0 --speed=115200
terminal_output console serial
echo "USB2C3A CHOICE: n r q d p c"
read selection
set extra=""
if [ "$selection" = "r" ]; then set extra="vos.usb2-residue=1"; fi
if [ "$selection" = "q" ]; then set extra="vos.usb2-residue=1 vos.usb2-qualify=1"; fi
if [ "$selection" = "d" ]; then set extra="vos.usb2-residue=1 vos.usb2c2-dma=1"; fi
if [ "$selection" = "p" ]; then set extra="vos.usb_probe=1"; fi
if [ "$selection" = "c" ]; then set extra="vos.usb_probe=1 vos.usb2-residue=1"; fi
set gfxpayload=1024x768x32,auto
multiboot2 /boot/vos.bin vos.apps=1 vos.desktop=1 vos.gui=1 $extra
module2 /boot/vsh.elf vsh
module2 /boot/hello.elf hello
module2 /boot/rixie.elf rixie
module2 /boot/gui-demo.elf gui-demo
boot
