name: Build smoke

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-smoke:
    name: Freestanding builds and user ELF static tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install build prerequisites
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-multilib binutils make python3 \
            grub-pc-bin grub-efi-amd64-bin xorriso mtools \
            qemu-system-x86 ovmf e2fsprogs

      - name: Verify legacy i386 Multiboot kernel
        run: make ARCH=i386 verify

      - name: Prepare the existing bare-metal Rust toolchain
        shell: bash
        run: |
          rustup toolchain install nightly-2026-09-03 --profile minimal --target x86_64-unknown-none
          echo "RUSTC=$(rustup which --toolchain nightly-2026-09-03 rustc)" >> "$GITHUB_ENV"

      - name: Build x86_64 BIOS and UEFI ISOs
        run: |
          make ARCH=x86_64 iso
          make ARCH=x86_64 uefi-iso

      - name: Validate separately built user ELF profiles
        run: make ARCH=x86_64 user-test

      - name: Verify migrated ELF bounds and hosted compatibility
        run: |
          python3 -I -B scripts/test-elf-bounds.py \
            --archive build/x86_64/rust/libvos_kernel.a \
            --elfcheck build/x86_64/tools/elfcheck \
            --user build/x86_64/user --out build/r1-elf-bounds-ci

      - name: Verify read-only USB.1 probing and input diagnostics
        run: python3 -I -B scripts/test-usb-probe.py --host-only --archive build/x86_64/rust/libvos_kernel.a --output build/usb1-host-ci

      - name: Verify production Rust PS/2 decoder and input compatibility
        run: |
          python3 -I -B scripts/test-ps2-pointer-rust.py \
            --archive build/x86_64/rust/libvos_kernel.a \
            --rustc "$RUSTC" --out build/r2b-pointer-ci

      - name: Verify USB.2-C1 read-only xHCI qualification and USB.2-B ownership
        run: |
          python3 -I -B scripts/test-usb2c1.py \
            --archive build/x86_64/rust/libvos_kernel.a \
            --rustc "$RUSTC" --out build/usb2c1-ci
          python3 -I -B scripts/test-usb-resources.py \
            --archive build/x86_64/rust/libvos_kernel.a \
            --rustc "$RUSTC" --out build/usb2b-ci

      - name: Verify USB.2-C2 DMA ownership model and adapter
        run: |
          python3 -I -B scripts/test-usb2c2.py \
            --archive build/x86_64/rust/libvos_kernel.a \
            --rustc "$RUSTC" --out build/usb2c2-ci

      - name: Verify USB.2-C3a firmware residue guard, dry-run lifecycle and panic-free link
        run: |
          python3 -I -B scripts/test-usb2c3a.py \
            --archive build/x86_64/rust/libvos_kernel.a \
            --kernel-map build/x86_64/kernel.map \
            --rustc "$RUSTC" --out build/usb2c3a-ci

      - name: Verify USB.2-C3a.2 early UEFI firmware memory exclusion
        run: |
          python3 -I -B scripts/test-usb2c3a2.py \
            --archive build/x86_64/rust/libvos_kernel.a \
            --kernel-map build/x86_64/kernel.map \
            --rustc "$RUSTC" --out build/usb2c3a2-ci
