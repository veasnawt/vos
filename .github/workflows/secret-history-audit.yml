name: Secret history audit

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-history-scan:
    name: Gitleaks - all reachable Git history
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout all Git history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install and verify Gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        shell: bash
        run: |
          set -euo pipefail
          install_dir="$RUNNER_TEMP/gitleaks-tool"
          mkdir -p "$install_dir"
          cd "$install_dir"

          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          checksums="gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          release_url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"

          curl --fail --silent --show-error --location --output "$archive" "$release_url/$archive"
          curl --fail --silent --show-error --location --output "$checksums" "$release_url/$checksums"
          awk -v name="$archive" '$2 == name' "$checksums" > selected-checksum.txt
          test -s selected-checksum.txt
          sha256sum -c selected-checksum.txt
          tar -xzf "$archive" gitleaks
          echo "$install_dir" >> "$GITHUB_PATH"

      - name: Scan every reachable commit for secrets
        shell: bash
        run: |
          set -euo pipefail
          gitleaks git --redact --log-opts='--all' .
